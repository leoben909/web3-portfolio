kind = "web"
previewPath = "/"
title = "Ben's Web3 Portfolio"
description = "A premium, cinematic Web3 portfolio website for Ben — a Web3 Community Manager and Discord/Telegram Moderator. Features a 3D interactive hero with React Three Fiber, glassmorphism UI, Framer Motion animations, experience timeline, skills showcase, and contact section. Built with React, TypeScript, Tailwind CSS, Three.js/React Three Fiber, and Framer Motion."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
